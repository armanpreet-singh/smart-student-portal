name: Frontend build

on:
  push:
    branches:
      - main
      - "ui/teacher-attendance-workflow"
      - "feat/auth-login-api"
      - "feat/auth-session-provider"
      - "feat/auth-role-route-guards"
      - "feat/auth-forced-password-change"
      - "feat/admin-attendance-api"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
