name: Frontend build

on:
  push:
    branches:
      - main
      - "ui/teacher-attendance-workflow"
      - "feat/auth-login-api"
      - "feat/auth-session-provider"
      - "feat/auth-role-route-guards"
      - "feat/auth-forced-password-change"
      - "feat/student-attendance-api"
      - "feat/admin-attendance-api"
      - "feat/admin-class-subject-catalogue"
      - "feat/admin-student-directory"
      - "feat/admin-teacher-directory"
      - "feat/admin-student-provisioning"
      - "feat/admin-teacher-provisioning"
      - "feat/admin-account-status-controls"
      - "feat/admin-managed-password-reset"
      - "feat/admin-teacher-subject-assignments"
      - "feat/admin-class-management"
      - "feat/admin-subject-management"
      - "feat/admin-reports-analytics"
      - "feat/admin-departments-capability"
      - "feat/admin-announcements-capability"
      - "feat/admin-calendar-capability"
      - "feat/teacher-calendar-capability"
      - "feat/student-calendar-capability"
      - "feat/student-announcements-capability"
      - "feat/teacher-announcements-capability"
      - "feat/teacher-dashboard-capability"
      - "feat/teacher-classes-api"
      - "feat/teacher-students-api"
  pull_request:
    branches:
      - main
      - "feat/teacher-dashboard-capability"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
